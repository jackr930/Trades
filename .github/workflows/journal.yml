name: Journal

# After every US close: log the Live Desk's recommendations for the session, score the
# ones whose 5- and 21-session windows have passed, and commit both to the repository.
# Later the same evening, a separate job trades the experiment on an Alpaca PAPER account.
#
# If either job fails, or `trades journal health` finds a problem (a missed session, a stuck
# or badly filled paper order), the workflow opens an issue labelled journal-health, or adds
# a comment to the one already open. GitHub emails you about both. On Fridays, when the
# repository variable DIGEST_ISSUE is "true", it also posts a weekly digest as a comment on
# an issue labelled journal-digest.
on:
  schedule:
    # 22:15 UTC on weekdays: after the 16:00 New York close in both EDT (20:00 UTC) and EST (21:00 UTC).
    # The recorder itself skips holidays and refuses data that does not reach today's session.
    - cron: "15 22 * * 1-5"
    # 00:30 UTC Tuesday to Saturday = 8:30pm EDT / 7:30pm EST the evening before: after 7:00pm ET, when
    # Alpaca starts accepting opening-auction orders for the next session.
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [journal, paper]
        default: journal

permissions:
  contents: write
  issues: write # health alerts and the weekly digest

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  journal:
    if: github.event.schedule == '15 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.job == 'journal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: the decision rule's registration date comes from git log
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Record today's recommendations
        # Yahoo first; if it fails, Alpaca (data API only), with keys from the repository's Actions secrets.
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: trades journal record
      - name: Score past recommendations
        id: score
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: trades journal score
      - name: Commit
        # Also after a failed score step: a session's rows cannot be recorded again later.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/
          if git diff --cached --quiet; then
            echo "Nothing changed; no commit."
            exit 0
          fi
          git commit -m "Journal: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
      - name: Health check
        run: trades journal health | tee health.txt
        shell: bash # with pipefail: the step fails when the check does
      - name: Weekly digest
        if: ${{ !cancelled() && steps.score.outcome == 'success' && vars.DIGEST_ISSUE == 'true' && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%u)" != "5" ]; then echo "The digest goes out on Fridays."; exit 0; fi
          trades journal digest > digest.md
          gh label create journal-digest --color 0E8A16 --description "Weekly forward-journal digest" --force
          n=$(gh issue list --label journal-digest --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file digest.md
          else
            gh issue create --title "Weekly journal digest" --label journal-digest --body-file digest.md
          fi
      - name: Alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/alert.sh "journal"

  paper:
    # Paper account only (https://paper-api.alpaca.markets is hard-coded; there is no live endpoint).
    # Orders are sent only when the repository variable PAPER_SUBMIT is "true"; otherwise this is a dry run.
    if: github.event.schedule == '30 0 * * 2-6' || (github.event_name == 'workflow_dispatch' && inputs.job == 'paper')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Trade the paper account
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          PAPER_SUBMIT: ${{ vars.PAPER_SUBMIT }}
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo "No Alpaca paper keys in the repository secrets: skipping paper trading."
            exit 0
          fi
          if [ "$PAPER_SUBMIT" = "true" ]; then
            trades paper --submit
          else
            trades paper
          fi
      - name: Commit the order log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/
          if git diff --cached --quiet; then
            echo "Nothing changed; no commit."
            exit 0
          fi
          git commit -m "Paper orders: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
      - name: Alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/alert.sh "paper"
